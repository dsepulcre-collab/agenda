<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Configuración para App Móvil (PWA) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <title>Modo Conducción ✨ Agenda RV</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .pulse-animation {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        body { 
            background-color: #0f172a; 
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior: none;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .driving-btn {
            touch-action: manipulation;
        }
        /* Evitar selección de texto molesta en conducción */
        * { -webkit-user-select: none; user-select: none; }
        #transcription-preview { user-select: text; -webkit-user-select: text; }
    </style>
    <script>
        let gisReady = false;
        let gapiReady = false;

        function libLoaded(lib) {
            if (lib === 'gis') gisReady = true;
            if (lib === 'gapi') gapiReady = true;
            if (gisReady && gapiReady) {
                setTimeout(() => {
                    if (typeof initServices === 'function') initServices();
                }, 200);
            }
        }
    </script>
</head>
<body class="p-4 text-slate-100 text-center">

    <div class="max-w-md w-full bg-slate-900 rounded-[3.5rem] shadow-2xl overflow-hidden border border-slate-800 relative">
        
        <!-- Botón de Ajustes -->
        <button id="settings-btn" class="absolute top-8 right-8 text-slate-400 hover:text-white z-20 p-2">
            <i class="fa-solid fa-gear text-xl"></i>
        </button>

        <!-- Cabecera -->
        <div class="bg-gradient-to-br from-indigo-600 to-blue-700 p-8 text-white text-center">
            <h1 class="text-2xl font-black tracking-tight">AGENDA RV ✨</h1>
            <p class="text-indigo-100 text-[10px] font-bold uppercase tracking-widest mt-1 italic text-center">Modo Conducción Activo</p>
        </div>

        <!-- Pantalla de Autenticación -->
        <div id="auth-section" class="p-10 text-center">
            <i class="fa-solid fa-shield-check text-6xl text-indigo-500 mb-6 opacity-80"></i>
            
            <div id="setup-warning" class="hidden mb-6 p-4 bg-red-500/20 border-2 border-red-500/50 rounded-2xl text-red-100 text-sm text-left">
                <b id="warning-title" class="uppercase block mb-1 text-xs text-center">Configuración Requerida</b>
                <p id="warning-text" class="text-[10px] text-center">Pulsa el icono ⚙️ para configurar tus llaves de acceso de Google Cloud o edita el archivo index.html.</p>
            </div>

            <button id="auth-button" class="w-full bg-white text-slate-900 font-bold py-5 px-6 rounded-3xl flex items-center justify-center shadow-lg active:scale-95 transition-all">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" class="w-6 h-6 mr-3" alt="Google">
                ENTRAR CON GOOGLE
            </button>
        </div>

        <!-- Panel de Ajustes -->
        <div id="settings-panel" class="hidden p-8 space-y-4 bg-slate-900 absolute inset-0 z-30 flex flex-col pt-20 overflow-y-auto">
            <h2 class="text-xl font-bold border-b border-slate-700 pb-2 flex items-center text-white">
                <i class="fa-solid fa-key mr-2 text-indigo-400"></i> Ajustes App
            </h2>
            
            <div class="space-y-4 text-left">
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase">Google API Key</label>
                    <input type="password" id="config-api-key" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm mt-1 text-white focus:border-indigo-500 outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase">Google Client ID</label>
                    <input type="text" id="config-client-id" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm mt-1 text-white focus:border-indigo-500 outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase">ID del Documento</label>
                    <input type="text" id="config-doc-id" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm mt-1 text-white font-mono focus:border-indigo-500 outline-none">
                </div>
            </div>

            <div class="pt-4 space-y-3">
                <button id="save-settings" class="w-full py-4 bg-indigo-600 rounded-2xl font-bold text-white uppercase text-xs tracking-widest">Guardar y Reiniciar</button>
                <button id="close-settings" class="w-full py-4 bg-slate-800 rounded-2xl font-bold text-slate-400 uppercase text-xs tracking-widest">Cerrar</button>
            </div>
        </div>

        <!-- App Principal -->
        <div id="app-section" class="hidden p-8 space-y-6">
            <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-center">
                <div id="doc-name" class="text-indigo-400 font-bold truncate text-xs italic tracking-tight">Cargando Agenda...</div>
            </div>

            <div class="text-center space-y-4 py-2">
                <div id="status-indicator" class="text-[10px] font-black text-slate-500 uppercase tracking-[0.3em]">SISTEMA LISTO</div>
                <div id="transcription-preview" class="min-h-[160px] p-6 bg-slate-950 border border-slate-800 rounded-[2.5rem] text-slate-300 italic text-xl flex flex-col items-center justify-center text-center leading-relaxed">
                    <span id="preview-text">"Pulsa el micro y habla"</span>
                </div>
            </div>

            <div class="flex flex-col items-center space-y-6">
                <button id="record-btn" class="driving-btn w-32 h-32 bg-indigo-600 text-white rounded-full flex items-center justify-center shadow-[0_0_40px_rgba(79,70,229,0.3)] active:scale-90 transition-all border-[8px] border-slate-900 outline outline-4 outline-indigo-500/10">
                    <i id="mic-icon" class="fa-solid fa-microphone text-5xl"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Feedback Visual -->
    <div id="msg-box" class="fixed top-10 left-1/2 -translate-x-1/2 w-11/12 max-w-xs px-6 py-4 rounded-2xl bg-white text-slate-900 font-bold text-center shadow-2xl opacity-0 transition-opacity pointer-events-none z-50 uppercase text-[10px]">
        MENSAJE
    </div>

    <!-- Librerías de Google -->
    <script src="https://accounts.google.com/gsi/client" async defer onload="libLoaded('gis')"></script>
    <script src="https://apis.google.com/js/api.js" async defer onload="libLoaded('gapi')"></script>

    <script>
        // --- CONFIGURACIÓN PERMANENTE ---
        const HARDCODED_API_KEY = "AIzaSyB3RGVs8JuETrkPKPljmqLpbPLNsGUsmys"; 
        const HARDCODED_CLIENT_ID = "1011569758504-5ln5ld1lascviri42uks2fh0i9jcheb7.apps.googleusercontent.com";
        const HARDCODED_DOC_ID = "1dkKdGLSYj2fJHaNQ1D5y-AFW_EAdQNJHelD1wAR7lJU";

        const SCOPES = 'https://www.googleapis.com/auth/documents https://www.googleapis.com/auth/drive.file';

        let savedApiKey = HARDCODED_API_KEY || localStorage.getItem('cfg_api_key') || '';
        let savedClientId = HARDCODED_CLIENT_ID || localStorage.getItem('cfg_client_id') || '';
        let configDocId = HARDCODED_DOC_ID || localStorage.getItem('cfg_doc_id') || '';
        let documentId = configDocId;

        let tokenClient, accessToken = null;
        let isRecording = false;

        const authSection = document.getElementById('auth-section'), appSection = document.getElementById('app-section');
        const settingsPanel = document.getElementById('settings-panel'), recordBtn = document.getElementById('record-btn');
        const statusInd = document.getElementById('status-indicator'), previewText = document.getElementById('preview-text');
        const warningBox = document.getElementById('setup-warning');

        window.onload = () => {
            document.getElementById('config-api-key').value = savedApiKey;
            document.getElementById('config-client-id').value = savedClientId;
            document.getElementById('config-doc-id').value = configDocId;
            
            if (!savedApiKey || !savedClientId) {
                warningBox.classList.remove('hidden');
            }
        };

        async function initServices() {
            if (!savedApiKey || !savedClientId) return;
            try {
                await new Promise((resolve) => gapi.load('client', resolve));
                await gapi.client.init({ apiKey: savedApiKey });
                
                // Carga explícita de APIs para evitar errores de descubrimiento
                await gapi.client.load('https://docs.googleapis.com/$discovery/rest?version=v1');
                await gapi.client.load('https://www.googleapis.com/discovery/v1/apis/drive/v3/rest');

                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: savedClientId,
                    scope: SCOPES,
                    callback: (resp) => {
                        if (resp.error) return;
                        accessToken = resp.access_token;
                        gapi.client.setToken(resp);
                        startApp();
                    },
                });
                initSpeech();
                warningBox.classList.add('hidden');
            } catch (err) { 
                console.error("Error GAPI:", err);
                const errorMsg = err?.result?.error?.message || "";
                
                // Detección específica de error de restricción por Referer
                if (errorMsg.includes("referer") || err?.status === 403) {
                    statusInd.textContent = "BLOQUEO DE SEGURIDAD (403)";
                    warningBox.classList.remove('hidden');
                    document.getElementById('warning-title').textContent = "Acceso Denegado (403)";
                    document.getElementById('warning-text').innerHTML = "La API Key está bloqueada en este entorno por restricciones de dominio. <br><b>Prueba la app en tu dominio autorizado (GitHub)</b>.";
                } else {
                    statusInd.textContent = "ERROR DE CONEXIÓN";
                }
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'es-ES';
                u.rate = 1.1;
                window.speechSynthesis.speak(u);
            }
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        function initSpeech() {
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'es-ES';
                recognition.interimResults = true;
                recognition.continuous = true; 

                recognition.onstart = () => {
                    isRecording = true;
                    recordBtn.classList.add('pulse-animation', 'bg-red-500');
                    statusInd.textContent = "ESCUCHANDO...";
                    previewText.textContent = "...";
                    speak("Dime");
                };

                recognition.onresult = (e) => {
                    let finalStr = "";
                    for (let i = 0; i < e.results.length; ++i) {
                        finalStr += e.results[i][0].transcript;
                    }
                    previewText.textContent = finalStr;
                };

                recognition.onend = () => {
                    if (isRecording) {
                        recognition.start();
                        return;
                    }
                    
                    recordBtn.classList.remove('pulse-animation', 'bg-red-500');
                    statusInd.textContent = "SISTEMA LISTO";
                    const text = previewText.textContent.trim();
                    if (text && text.length > 2 && text !== "...") {
                        saveNote(text);
                    } else {
                        previewText.textContent = "Pulsa el micro y habla";
                    }
                };
            }
        }

        async function saveNote(text) {
            try {
                const now = new Date();
                const timestamp = now.toLocaleDateString('es-ES') + " " + now.toLocaleTimeString('es-ES', {hour: '2-digit', minute:'2-digit'});
                const entry = `[${timestamp}]\n${text}\n--------------------------------------------\n\n`;

                await gapi.client.docs.documents.batchUpdate({ 
                    documentId: documentId, 
                    resource: { 
                        requests: [{ 
                            insertText: { 
                                location: { index: 1 }, 
                                text: entry 
                            } 
                        }] 
                    } 
                });
                showMsg("GUARDADO");
                speak("Anotado");
                setTimeout(() => { 
                    if (!isRecording) previewText.textContent = "Pulsa el micro y habla"; 
                }, 3000);
            } catch (err) { showMsg("ERROR AL GUARDAR"); }
        }

        async function startApp() {
            authSection.classList.add('hidden');
            appSection.classList.remove('hidden');
            fetchDocInfo();
        }

        async function fetchDocInfo() {
            try {
                const doc = await gapi.client.docs.documents.get({ documentId: documentId });
                document.getElementById('doc-name').textContent = doc.result.title;
            } catch (e) { showMsg("ERROR DE ACCESO AL DOC"); }
        }

        document.getElementById('save-settings').onclick = () => {
            localStorage.setItem('cfg_api_key', document.getElementById('config-api-key').value);
            localStorage.setItem('cfg_client_id', document.getElementById('config-client-id').value);
            localStorage.setItem('cfg_doc_id', document.getElementById('config-doc-id').value);
            location.reload();
        };

        document.getElementById('settings-btn').onclick = () => settingsPanel.classList.remove('hidden');
        document.getElementById('close-settings').onclick = () => settingsPanel.classList.add('hidden');
        document.getElementById('auth-button').onclick = () => {
            if (tokenClient) {
                tokenClient.requestAccessToken();
            } else {
                showMsg("INICIALIZANDO...");
                initServices();
            }
        };
        
        recordBtn.onclick = () => {
            if (isRecording) {
                isRecording = false;
                recognition.stop();
            } else {
                if (recognition) recognition.start();
                else showMsg("VOZ NO LISTA");
            }
        };

        function showMsg(text) {
            const box = document.getElementById('msg-box');
            box.textContent = text;
            box.classList.remove('opacity-0');
            setTimeout(() => box.classList.add('opacity-0'), 4000);
        }
    </script>
</body>
</html>
