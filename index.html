<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda RV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Animación para el botón de grabación activa */
        .pulse-red { animation: pulse-red 2s infinite; }
        @keyframes pulse-red {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.15); box-shadow: 0 0 0 25px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        body { 
            background-color: #0f172a; 
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior: none;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 text-slate-200">

    <!-- Contenedor Principal Manos Libres -->
    <div class="w-full max-w-md bg-slate-900 rounded-[3.5rem] shadow-[0_20px_60px_rgba(0,0,0,0.6)] p-10 border border-slate-800 text-center relative overflow-hidden">
        
        <!-- Elementos decorativos suaves -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-indigo-600/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-blue-600/10 rounded-full blur-3xl"></div>

        <!-- Cabecera -->
        <div class="relative z-10 mb-10 text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-indigo-600 to-blue-500 rounded-3xl shadow-lg mb-4 mx-auto">
                <i class="fa-solid fa-microphone-lines text-2xl text-white"></i>
            </div>
            <h1 class="text-3xl font-black text-white tracking-tighter uppercase text-center">Agenda RV</h1>
            <p id="status-text" class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.3em] mt-2 text-center">Iniciando sistema...</p>
        </div>

        <!-- Pantalla de Inicio de Sesión -->
        <div id="login-screen" class="relative z-10 space-y-6 text-center">
            <p class="text-slate-400 text-sm leading-relaxed px-4 text-center">Conecta tu cuenta de empresa para guardar notas directamente en tu Google Docs.</p>
            <button id="auth-btn" class="w-full py-5 bg-white text-black font-black rounded-[2rem] flex items-center justify-center gap-3 active:scale-95 transition-all shadow-xl hover:bg-slate-100">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" class="w-6" alt="Google">
                ENTRAR CON GOOGLE
            </button>
        </div>

        <!-- Pantalla de Grabación Activa -->
        <div id="record-screen" class="hidden relative z-10 space-y-8 text-center">
            <div class="space-y-1 text-center">
                <span id="doc-title" class="text-indigo-400 font-black text-sm uppercase tracking-widest block truncate text-center">...</span>
                <span id="recording-label" class="text-[10px] font-medium text-slate-500 uppercase tracking-[0.2em] text-center block">Listo para dictar</span>
            </div>

            <div class="bg-slate-950/60 rounded-[2.5rem] p-8 min-h-[220px] flex items-center justify-center border border-slate-800 shadow-inner">
                <p id="transcript" class="text-xl font-medium italic text-slate-300 leading-snug text-center">"Pulsa el círculo y dicta tu interacción..."</p>
            </div>

            <div class="pt-2 flex justify-center text-center">
                <button id="mic-btn" class="w-28 h-28 bg-indigo-600 rounded-full flex items-center justify-center shadow-[0_0_40px_rgba(79,70,229,0.3)] active:scale-90 transition-all group mx-auto">
                    <i id="mic-icon" class="fa-solid fa-microphone text-4xl text-white group-hover:scale-110 transition-transform"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Notificación Flotante (Toast) -->
    <div id="toast" class="fixed bottom-12 px-8 py-4 bg-emerald-500 text-white rounded-full font-black shadow-2xl opacity-0 transition-all transform translate-y-4 pointer-events-none z-50 uppercase text-[10px] tracking-widest">
        Guardado con éxito
    </div>

    <!-- Librerías oficiales de Google -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>

    <script>
        // CONFIGURACIÓN ESTÁTICA
        const CLIENT_ID = '1011569758504-5ln5ld1lascviri42uks2fh0i9jcheb7.apps.googleusercontent.com'; 
        const API_KEY = 'AIzaSyB3RGVs8JuETrkPKPljmqLpbPLNsGUsmys';
        const SCOPES = 'https://www.googleapis.com/auth/documents https://www.googleapis.com/auth/drive.file';
        const DOC_NAME = 'Agenda de Interacciones Clientes';

        let tokenClient;
        let accessToken = null;
        let documentId = localStorage.getItem('agenda_rv_doc_id');

        // Referencias a elementos de la interfaz
        const loginScreen = document.getElementById('login-screen');
        const recordScreen = document.getElementById('record-screen');
        const statusText = document.getElementById('status-text');
        const transcriptEl = document.getElementById('transcript');
        const recordingLabel = document.getElementById('recording-label');
        const micBtn = document.getElementById('mic-btn');
        const docTitleEl = document.getElementById('doc-title');

        // Inicialización al cargar la ventana
        window.onload = () => {
            if (!CLIENT_ID || !API_KEY) {
                statusText.textContent = "Error: Faltan credenciales";
                return;
            }
            // Cargamos gapi
            gapi.load('client', startGapi);
        };

        async function startGapi() {
            try {
                // Inicializamos el cliente de forma básica primero
                await gapi.client.init({
                    apiKey: API_KEY
                });

                // Cargamos las APIs de forma explícita en lugar de usar discoveryDocs en init
                // Esto es más fiable en entornos de iframes o proxies
                await gapi.client.load('https://docs.googleapis.com/$discovery/rest?version=v1');
                await gapi.client.load('https://www.googleapis.com/discovery/v1/apis/drive/v3/rest');

                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: SCOPES,
                    callback: (resp) => {
                        if (resp.error) {
                            console.error("Error OAuth:", resp.error);
                            showToast("Error de autenticación");
                            return;
                        }
                        accessToken = resp.access_token;
                        onAuthSuccess();
                    }
                });
                
                statusText.textContent = "Google Ready";
            } catch (err) {
                console.error("Error inicializando GAPI:", err);
                statusText.textContent = "Fallo de conexión";
            }
        }

        function onAuthSuccess() {
            loginScreen.classList.add('hidden');
            recordScreen.classList.remove('hidden');
            statusText.textContent = "Sesión Activa";
            findOrCreateDoc();
        }

        async function findOrCreateDoc() {
            docTitleEl.textContent = "Sincronizando con Drive...";
            
            if (documentId) {
                try {
                    const res = await gapi.client.docs.documents.get({ documentId: documentId });
                    docTitleEl.textContent = res.result.title;
                    return;
                } catch (e) { 
                    console.warn("ID guardado no válido, buscando de nuevo...");
                    documentId = null; 
                }
            }

            try {
                const res = await gapi.client.drive.files.list({ 
                    q: `name = '${DOC_NAME}' and trashed = false and mimeType = 'application/vnd.google-apps.document'`,
                    fields: 'files(id, name)'
                });
                const files = res.result.files;
                
                if (files && files.length > 0) {
                    documentId = files[0].id;
                } else {
                    const newDoc = await gapi.client.docs.documents.create({ title: DOC_NAME });
                    documentId = newDoc.result.documentId;
                }
                localStorage.setItem('agenda_rv_doc_id', documentId);
                docTitleEl.textContent = DOC_NAME;
            } catch (err) {
                docTitleEl.textContent = "Error de Documento";
                console.error("Error Drive:", err);
            }
        }

        // --- SISTEMA DE VOZ ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            transcriptEl.textContent = "Voz no compatible en este navegador.";
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.interimResults = true;
            let isRecording = false;

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.add('pulse-red', 'bg-red-500');
                micBtn.classList.remove('bg-indigo-600');
                recordingLabel.textContent = "Escuchando...";
                transcriptEl.textContent = "...";
                speakFeedback("Dime");
            };

            recognition.onresult = (e) => {
                const text = Array.from(e.results).map(r => r[0].transcript).join('');
                transcriptEl.textContent = text;
            };

            recognition.onend = () => {
                isRecording = false;
                micBtn.classList.remove('pulse-red', 'bg-red-500');
                micBtn.classList.add('bg-indigo-600');
                recordingLabel.textContent = "Guardando...";
                const text = transcriptEl.textContent.trim();
                if (text && text.length > 2 && text !== "...") {
                    saveToGoogleDocs(text);
                } else {
                    recordingLabel.textContent = "Listo";
                    transcriptEl.textContent = "Pulsa el micro y habla...";
                }
            };

            micBtn.onclick = () => isRecording ? recognition.stop() : recognition.start();
        }

        async function saveToGoogleDocs(text) {
            try {
                const doc = await gapi.client.docs.documents.get({ documentId: documentId });
                const endIdx = doc.result.body.content[doc.result.body.content.length - 1].endIndex - 1;
                const now = new Date();
                const timestamp = now.toLocaleDateString('es-ES') + " " + now.toLocaleTimeString('es-ES', {hour: '2-digit', minute:'2-digit'});
                const formattedContent = `\n\n--------------------------------------------\n📅 [${timestamp}]\n💬 ${text}`;

                await gapi.client.docs.documents.batchUpdate({
                    documentId: documentId,
                    resource: { requests: [{ insertText: { location: { index: endIdx }, text: formattedContent } }] }
                });
                
                showToast("Guardado");
                speakFeedback("Anotado");
                recordingLabel.textContent = "Listo";
                setTimeout(() => { transcriptEl.textContent = "Pulsa el micrófono para dictar..."; }, 2500);
            } catch (err) {
                console.error("Error guardando nota:", err);
                showToast("Error al guardar");
                recordingLabel.textContent = "Error";
            }
        }

        function speakFeedback(text) {
            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'es-ES';
                u.rate = 1.1;
                window.speechSynthesis.speak(u);
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.opacity = "1";
            t.style.transform = "translateY(0)";
            setTimeout(() => {
                t.style.opacity = "0";
                t.style.transform = "translateY(4px)";
            }, 3000);
        }

        document.getElementById('auth-btn').onclick = () => tokenClient.requestAccessToken();

    </script>
</body>
</html>
